<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="240" height="260" role="img"><title>Robot is overheating</title><style>g.arm.l{transform:rotate(40deg);transform-origin:63px 170px}g.arm.r{transform:rotate(-40deg);transform-origin:177px 170px}.bot{animation:shake .14s linear infinite}@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}.glow{animation:glow 1.2s ease-in-out infinite;transform-origin:120px 140px}@keyframes glow{0%,100%{opacity:.35;transform:scale(.94)}50%{opacity:.7;transform:scale(1.04)}}.ball{animation:alarm .5s steps(1) infinite}@keyframes alarm{50%{fill:#FFD7D7}}.steam{opacity:0;animation:rise 2.1s ease-out infinite}.s1{animation-delay:.7s}.s2{animation-delay:1.4s}@keyframes rise{0%{opacity:0;transform:translateY(14px) scale(.6)}25%{opacity:.9}100%{opacity:0;transform:translateY(-28px) scale(1.5)}}.spark{animation:zap .9s steps(1) infinite}.k1{animation-delay:.45s}@keyframes zap{50%{opacity:0}}</style><defs><radialGradient id="g"><stop offset="0" stop-color="#FF4D4D"/><stop offset="1" stop-color="#FF4D4D" stop-opacity="0"/></radialGradient></defs><ellipse class="glow" cx="120" cy="140" rx="118" ry="122" fill="url(#g)"/><ellipse cx="120" cy="250" rx="64" ry="7" fill="#7B9CFF" opacity=".25"/><g class="bot"><g class="ant"><path d="M120 46V28" stroke="#2E3A6E" stroke-width="4" stroke-linecap="round"/><circle class="ball" cx="120" cy="22" r="8" fill="#FF5B5B" stroke="#2E3A6E" stroke-width="3" stroke-linejoin="round"/></g><rect x="108" y="42" width="24" height="12" rx="5" fill="#5A78E6" stroke="#2E3A6E" stroke-width="3" stroke-linejoin="round"/><g class="arm l"><rect x="54" y="166" width="18" height="44" rx="9" fill="#5A78E6" stroke="#2E3A6E" stroke-width="3" stroke-linejoin="round"/><circle cx="63" cy="212" r="10" fill="#7B9CFF" stroke="#2E3A6E" stroke-width="3" stroke-linejoin="round"/></g><g class="arm r"><rect x="168" y="166" width="18" height="44" rx="9" fill="#5A78E6" stroke="#2E3A6E" stroke-width="3" stroke-linejoin="round"/><circle cx="177" cy="212" r="10" fill="#7B9CFF" stroke="#2E3A6E" stroke-width="3" stroke-linejoin="round"/></g><rect x="110" y="150" width="20" height="14" fill="#5A78E6" stroke="#2E3A6E" stroke-width="3" stroke-linejoin="round"/><rect x="90" y="218" width="20" height="18" rx="6" fill="#5A78E6" stroke="#2E3A6E" stroke-width="3" stroke-linejoin="round"/><rect x="130" y="218" width="20" height="18" rx="6" fill="#5A78E6" stroke="#2E3A6E" stroke-width="3" stroke-linejoin="round"/><rect x="82" y="230" width="32" height="14" rx="7" fill="#7B9CFF" stroke="#2E3A6E" stroke-width="3" stroke-linejoin="round"/><rect x="126" y="230" width="32" height="14" rx="7" fill="#7B9CFF" stroke="#2E3A6E" stroke-width="3" stroke-linejoin="round"/><rect x="72" y="160" width="96" height="64" rx="24" fill="#7B9CFF" stroke="#2E3A6E" stroke-width="3" stroke-linejoin="round"/><rect x="94" y="176" width="52" height="30" rx="10" fill="#A8BCFF" stroke="#2E3A6E" stroke-width="3" stroke-linejoin="round"/><circle class="led" cx="106" cy="191" r="4.5" fill="#FF6B5B"/><circle class="led" cx="120" cy="191" r="4.5" fill="#FF6B5B"/><circle class="led" cx="134" cy="191" r="4.5" fill="#FF6B5B"/><circle cx="46" cy="104" r="10" fill="#5A78E6" stroke="#2E3A6E" stroke-width="3" stroke-linejoin="round"/><circle cx="194" cy="104" r="10" fill="#5A78E6" stroke="#2E3A6E" stroke-width="3" stroke-linejoin="round"/><rect x="50" y="52" width="140" height="104" rx="34" fill="#7B9CFF" stroke="#2E3A6E" stroke-width="3" stroke-linejoin="round"/><rect x="62" y="60" width="44" height="10" rx="5" fill="#fff" opacity=".35"/><rect x="66" y="72" width="108" height="68" rx="20" fill="#2A1C2E"/><g class="face"><path d="M88 96l16 9-16 9M152 96l-16 9 16 9" fill="none" stroke="#FF6B5B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M104 128q4-6 8 0t8 0 8 0 8 0" fill="none" stroke="#FF6B5B" stroke-width="3.5" stroke-linecap="round"/><path d="M170 7